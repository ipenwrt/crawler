name: sub_merge
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'TG_proxy_main.py'
      - '.github/workflows/main.yml'
  schedule:
    - cron: "0 */6 * * *"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: 迁出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: 安装 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装系统依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0
        
    - name: 安装 Python 依赖
      run: |
        python -m pip install --upgrade pip
        pip install curl_cffi ddddocr urllib3 opencv-python-headless numpy
        
    - name: 执行任务
      run: |
        if [ ! -f "domains.txt" ]; then
          echo "Error: domains.txt not found. Exiting."
          exit 1
        fi
        python ./TG_proxy_main.py || echo "Script finished with some errors"
      
    - name: 提交并推送更改
      run: |
        export TZ='Asia/Shanghai'
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Action"
        
        URL_COUNT=$(wc -l < urls.txt 2>/dev/null || echo "0")
        
        git add ./report.csv ./subscription ./nodes_plain.txt ./tg.cache 2>/dev/null || echo "No result files found"
        
        if git diff --staged --quiet; then
          echo "没有产生任何变化，跳过提交。"
        else
          git commit -m "$(date '+%Y-%m-%d %H:%M:%S') 自动更新 | 处理量: $URL_COUNT"
          git pull origin main --rebase -X theirs
          git push origin main
        fi
